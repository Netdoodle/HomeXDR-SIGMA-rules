title: Root SSH Login With A Password
id: 6cb448ce-155d-45f3-90cf-bb13893b5ba4
status: experimental
description: |
  root logged in over SSH with a password rather than a key. Passwords can be guessed and
  reused; on hosts that normally use keys, this can be someone else.
author: HomeXDR
date: 2026-11-11
references:
  - https://attack.mitre.org/techniques/T1078/003/
tags:
  - attack.initial-access
  - attack.t1078.003
logsource:
  category: authentication
detection:
  selection_login:
    event.action:
      - 'ssh_login'
      - 'ssh-login'
    event.outcome: 'success'
    User:
      - 'root'
      - 'Administrator'
  selection_method:
    - auth_method:
        - 'password'
        - 'keyboard-interactive'
        - 'keyboard-interactive/pam'
    - method:
        - 'password'
        - 'keyboard-interactive'
        - 'keyboard-interactive/pam'
  condition: all of selection_*
falsepositives:
  - Hosts where you log in as root with a password on purpose
level: medium
