title: HomeXDR Agent Stopped Or Removed On Windows
id: bf8c5330-250c-4720-8acb-80e3867fda82
status: experimental
description: |
  A command stopped, disabled, deleted, killed or uninstalled the HomeXDR agent service.
  Intruders blind the monitoring first.
author: HomeXDR
date: 2026-11-12
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://attack.mitre.org/techniques/T1489/
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - attack.impact
  - attack.t1489
logsource:
  product: windows
  category: process_creation
detection:
  selection_name:
    CommandLine|contains:
      - 'HomeXDRAgent'
      - 'homexdr-agent'
  selection_action:
    CommandLine|contains:
      - ' stop'
      - ' delete'
      - 'disabled'
      - 'Stop-Service'
      - 'Remove-Service'
      - 'Stop-Process'
      - 'taskkill'
      - ' uninstall'
  condition: all of selection_*
falsepositives:
  - You updating or removing the agent by hand
level: high
