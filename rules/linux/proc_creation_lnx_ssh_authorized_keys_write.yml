title: SSH Authorized Keys Changed From The Command Line
id: c3cea956-e908-4175-8868-7586aebcabb2
status: experimental
description: |
  A command wrote, copied or edited an authorized_keys file. Adding a key is the usual way
  to keep SSH access to a host after the first break-in. On Unraid the root keys live in
  /boot/config/ssh/root.
author: HomeXDR
date: 2026-11-11
references:
  - https://attack.mitre.org/techniques/T1098/004/
tags:
  - attack.persistence
  - attack.t1098.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|re: '(?:>>?\s*|tee\s+(?:-a\s+)?|sed\s+-i\S*\s.*|(?:cp|mv|install|curl|wget)\s.*)\S*authorized_keys2?(?:["''\s]|$)'
  condition: selection
falsepositives:
  - ssh-copy-id and configuration management adding your own keys
level: medium
