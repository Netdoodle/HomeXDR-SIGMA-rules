title: Unraid User Script Or Cron File Written From The Command Line
id: db92c736-b2e9-4323-bfc4-7fd0a6a1560b
status: experimental
description: |
  A command wrote a User Scripts script or a plugin cron file on the Unraid flash drive. Both
  run as root on a schedule and survive reboots and OS updates.
author: HomeXDR
date: 2026-11-12
references:
  - https://attack.mitre.org/techniques/T1053/003/
tags:
  - attack.persistence
  - attack.t1053.003
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|re: '(?:>>?\s*|tee\s+(?:-a\s+)?|sed\s+-i\S*\s.*|(?:cp|mv|install|curl|wget)\s.*)["'']?/boot/config/plugins/(?:user\.scripts/scripts/\S+|[^/\s]+/[^/\s]+\.cron)'
  condition: selection
falsepositives:
  - Scripts you add by copying them onto the flash drive
level: medium
